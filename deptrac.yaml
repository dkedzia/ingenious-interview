# Layer rules shared by every module: dependencies point inwards, towards the
# Domain, and only Infrastructure and Presentation may know about the framework.
# Module boundaries are checked separately, by deptrac.modules.yaml.
imports:
  - deptrac.baseline.yaml

deptrac:
  paths:
    - ./src

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Modules/[^/]+/Domain/.*

    # Named UseCase in Invoices and Application in Notifications.
    - name: Application
      collectors:
        - type: directory
          value: src/Modules/[^/]+/(UseCase|Application)/.*

    # What a module exposes to other modules.
    - name: ModuleApi
      collectors:
        - type: directory
          value: src/Modules/[^/]+/Api/.*

    # Base exceptions shared by all layers of a module.
    - name: ModuleExceptions
      collectors:
        - type: directory
          value: src/Modules/[^/]+/Exceptions/.*

    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Modules/[^/]+/Infrastructure/.*

    - name: Presentation
      collectors:
        - type: directory
          value: src/Modules/[^/]+/Presentation/.*

    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Laravel|Symfony)\\#'

    # PHP-FIG interfaces, such as the logger, which the framework implements.
    - name: Psr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\#'

    - name: Uuid
      collectors:
        - type: classNameRegex
          value: '#^Ramsey\\Uuid\\#'

  ruleset:
    Domain:
      - ModuleExceptions
      - Uuid
    Application:
      - Domain
      - ModuleApi
      - ModuleExceptions
      - Uuid
    ModuleApi:
      - Uuid
    ModuleExceptions: ~
    Infrastructure:
      - Domain
      - Application
      - ModuleApi
      - ModuleExceptions
      - Framework
      - Psr
      - Uuid
    Presentation:
      - Domain
      - Application
      - ModuleApi
      - ModuleExceptions
      - Framework
      - Psr
      - Uuid
